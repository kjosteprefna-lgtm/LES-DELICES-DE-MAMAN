  <!-- Crown / Banner text -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">DÉLICES DE MAMAN</text>
</svg>
