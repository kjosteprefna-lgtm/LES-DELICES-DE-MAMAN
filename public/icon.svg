    <path d="M 70,80 C 35,135 45,215 150,288 C 255,215 265,135 230,80 C 195,72 168,85 150,85 C 132,85 105,72 70,80 Z" fill="#ffe4e6" />
    
    <!-- Text / Seeds -->
    <circle cx="110" cy="130" r="8" fill="#e11d48" />
    <circle cx="150" cy="120" r="8" fill="#e11d48" />
    <circle cx="190" cy="130" r="8" fill="#e11d48" />
    <circle cx="90" cy="180" r="8" fill="#e11d48" />
    <circle cx="150" cy="175" r="9" fill="#e11d48" />
    <circle cx="210" cy="180" r="8" fill="#e11d48" />
    <circle cx="120" cy="225" r="8" fill="#e11d48" />
    <circle cx="180" cy="225" r="8" fill="#e11d48" />
    <circle cx="150" cy="260" r="7" fill="#e11d48" />
